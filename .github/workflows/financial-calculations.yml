name: Validate JJXCAPITAL financial calculations

# Cancelar las ejecuciones antiguas del mismo ref: solo interesa validar el código más reciente.
concurrency:
  group: financial-calculations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - fix/financial-calculations
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run regression tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - name: Build production bundle (without deploying)
        run: npm run build
